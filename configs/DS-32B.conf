# =============================================================================
# PUMA configuration — DS-32B
# Intended base model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
#
# Consumed by run_from_config.sh, which maps these variables to run_puma.py
# CLI flags. Every variable here is passed through; nothing is silently ignored.
# =============================================================================

# ---- Redundancy Detector (RD) ----
EMBEDDING_MODEL="ZhishanQ/qwen3-embedding-redundancy-detector-0.6B"
SIMILARITY_THRESHOLD=0.35            # tau_sim: flag a step as redundant when cosine sim > this
WINDOW_SIZE=1                        # k: compare each step against the last k steps

# ---- Loop Breaker (LB) ----  [m=4]
CONSECUTIVE_REDUNDANCY_STOP=4       # m: stop after m consecutive redundant steps (0 = LB disabled)
CONSECUTIVE_REDUNDANCY_MIN_STEP=50   # only activate LB after this reasoning step
FORCED_STOP_MIN_CONFIDENCE=0.8       # weak min-confidence gate for LB

# ---- Verified Early Exit (VEE) ----
CONFIDENCE_THRESHOLD=0.98            # lambda: minimum trial-answer confidence
EPSILON=0.03                         # max confidence drop allowed across consecutive checks
CONSECUTIVE=2                        # L: consecutive consistent checkpoints required to stop
