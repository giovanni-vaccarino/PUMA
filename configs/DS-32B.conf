# =============================================================================
# PUMA Pipeline Configuration File
# =============================================================================
# Used by run_pipeline.sh. See the repository README for usage:
#   bash run_pipeline.sh configs/<this>.conf <base_dir> <model> <dataset> [benchmark.jsonl]
#
# =============================================================================

# -----------------------------------------------------------------------------
# Two-stage Detection Parameters
# -----------------------------------------------------------------------------
CONFIDENCE_THRESHOLD=0.98
EPSILON=0.03
CONSECUTIVE=2
MIN_STOP_STEP=10           # Minimum step before allowing early stop

# -----------------------------------------------------------------------------
# Embedding-based Filtering Parameters (Problem 1: Reduce trial answer frequency)
# -----------------------------------------------------------------------------
ENABLE_EMBEDDING_FILTER="true"  # Set to "true" to enable, "" to disable
EMBEDDING_MODEL="ZhishanQ/qwen3-embedding-redundancy-detector-0.6B"
SIMILARITY_THRESHOLD=0.35       # τ_sim: similarity threshold for flagging
CONSECUTIVE_REDUNDANCY_STOP=4   # m: stop when m consecutive redundant steps (0=disabled)
CONSECUTIVE_REDUNDANCY_MIN_STEP=50  # Only start detecting consecutive redundancy after this step
FORCED_STOP_MIN_CONFIDENCE=0.8  # Quality gate: skip forced_stop if best trial confidence < this (0.0=disabled)

# -----------------------------------------------------------------------------
# Prompt Version
# Options: "default" | "direct" | "wo_stepbystep" | "aligned_with_deer"
# -----------------------------------------------------------------------------
# Step 1 Parameters: Answer Generation (run_vllm.py)
# -----------------------------------------------------------------------------
ANSWER_GEN_MAX_TOKENS=32768       # Max thinking tokens
ANSWER_FIX_MAX_TOKENS=2048        # Max tokens for truncated-thinking fix
# Note: run_vllm.py loads temperature/top_p from model's generation_config.json by default.
# Only set these to override the model defaults:
# ANSWER_GEN_TEMPERATURE=""       # "" = use model default; "0.0" = greedy; "0.6" = explicit
# ANSWER_GEN_TOP_P=""             # "" = use model default

# -----------------------------------------------------------------------------
# Step 2 Parameters: Trial Answer Generation
# -----------------------------------------------------------------------------
MAX_TRIAL_TOKENS=30       # Max tokens for trial answers
TEMPERATURE=0.6           # Temperature for trial answer generation
TOP_P=0.95                # Top_p for trial answer generation

# Decoding mode for Step 2 (trial answers):
#   "greedy"   - temperature=0.0 (deterministic)
#   "sampling" - uses TEMPERATURE/TOP_P settings
#   "default"  - no explicit temperature (vLLM SamplingParams defaults, temperature=1.0)
TRIAL_DECODING="sampling"

# Confidence calculation mode for Step 2 (trial answers):
#   "first_line"     - text before '.\n', includes braces/units (original PUMA)
#   "token_in_boxed" - only tokens inside {answer}, skip braces (like DEER)

# Confidence aggregation method for Step 2 and Step 4:
#   "geometric"  - exp(mean(logprobs)) — penalizes uncertain tokens more
#   "arithmetic" - mean(exp(logprobs)) — more lenient with outlier tokens

# GPQA-specific: temperature for ABCD softmax confidence renormalization
# When set, GPQA confidence is computed via temperature-scaled softmax over A/B/C/D logprobs
GPQA_SOFTMAX_TEMPERATURE=0.7

# -----------------------------------------------------------------------------
# Step 4 Parameters: Final Answer Generation
# -----------------------------------------------------------------------------
MAX_ANSWER_TOKENS=4096    # Max tokens for final answers
# Step 4 uses model's generation_config.json defaults (same as Step 1a).

# -----------------------------------------------------------------------------
# Random Seed (for reproducibility)
# Set to "" to disable (non-deterministic)
# -----------------------------------------------------------------------------
SEED=42
